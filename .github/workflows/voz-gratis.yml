name: Voz gratis (Edge TTS)

on:
  push:
    paths:
      - "tts/requests/**.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voz-gratis
  cancel-in-progress: false

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python tts/generar.py
      - name: Guardar audios
        run: |
          git config user.name "voz-bot"
          git config user.email "voz-bot@users.noreply.github.com"
          git add tts/out
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Voz generada"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
