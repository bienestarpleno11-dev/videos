name: Armar Short

on:
  push:
    paths:
      - "guiones/**.json"
      - "motor/**"
  workflow_dispatch:
    inputs:
      guion:
        description: "Ruta del guion, por ejemplo guiones/2026-11-24-aguinaldo.json. Vacío = todos"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: armar-short
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install edge-tts pillow
          ffmpeg -version | head -1

      - name: Generar la voz
        run: python motor/voz.py ${{ github.event.inputs.guion }}

      - name: Armar el video
        run: python motor/render.py ${{ github.event.inputs.guion }}

      - name: Guardar
        run: |
          git config user.name "short-bot"
          git config user.email "short-bot@users.noreply.github.com"
          git add shorts tts/out
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Short armado"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: shorts/*.mp4
          if-no-files-found: ignore
